name: Release

on:
  workflow_call:
    inputs:
      skip-existing-pypi:
        description: 'Pass skip-existing: true to PyPI publish action (safe for retries)'
        type: boolean
        default: false
      python-version:
        description: 'Python version to use'
        type: string
        default: '3.13'

jobs:
  check-tag:
    name: Check for release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check for version tag on triggering commit
        id: get_tag
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1)
          if [ -z "$TAG" ]; then
            echo "No version tag on this commit — skipping release."
          else
            echo "Release tag detected: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: check-tag
    timeout-minutes: 10
    if: ${{ needs.check-tag.outputs.tag != '' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Poetry env
        uses: SamuelJennings/cached-poetry-action@v2.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build package
        run: poetry build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: ${{ inputs.skip-existing-pypi }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-tag, publish-pypi]
    timeout-minutes: 10
    if: ${{ needs.check-tag.outputs.tag != '' }}
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-tag.outputs.tag }}
          name: Release ${{ needs.check-tag.outputs.tag }}
          body: ${{ steps.github_release.outputs.changelog }}
