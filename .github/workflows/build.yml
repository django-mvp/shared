name: Build

on:
  workflow_call:
    inputs:
      source-dir:
        description: 'Source directory to scan with bandit, e.g. mvp or dac'
        type: string
        required: true
      python-version:
        description: 'Python version to use for all build jobs'
        type: string
        default: '3.13'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Poetry env
        uses: django-mvp/shared/.github/actions/setup-poetry@main
        with:
          python-version: ${{ inputs.python-version }}

      - name: Load cached pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Check Poetry lock file consistency
        run: poetry check --lock

      - name: Run pre-commit checks
        run: poetry run pre-commit run --all-files

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Poetry env
        uses: django-mvp/shared/.github/actions/setup-poetry@main
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run bandit security linter
        run: |
          pip install bandit[toml]
          bandit -r ${{ inputs.source-dir }}/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Run safety check for known vulnerabilities
        run: |
          pip install safety
          safety check --json --output safety-report.json || true

      - name: Upload safety report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: safety-report
          path: safety-report.json

  package:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [code-quality]
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Poetry env
        uses: django-mvp/shared/.github/actions/setup-poetry@main
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build package
        run: poetry build

      - name: Check package metadata
        run: poetry check

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
