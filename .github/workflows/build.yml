name: Build

on:
  workflow_call:
    inputs:
      source-dir:
        description: 'Source directory to scan with bandit, e.g. mvp or dac'
        type: string
        required: true
      python-version:
        description: 'Python version to use for all build jobs'
        type: string
        default: '3.13'
      package-manager:
        description: 'Which package manager sets up the environment: poetry or uv'
        type: string
        default: 'poetry'
      uv-sync-args:
        description: 'Extra args passed to uv sync, e.g. --extra dev. Ignored when package-manager is poetry'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Poetry env
        if: inputs.package-manager == 'poetry'
        uses: django-mvp/shared/.github/actions/setup-poetry@v0.4.1
        with:
          python-version: ${{ inputs.python-version }}
          cache-key-suffix: code-quality

      - name: Set up uv env
        if: inputs.package-manager == 'uv'
        uses: django-mvp/shared/.github/actions/setup-uv@v0.4.1
        with:
          python-version: ${{ inputs.python-version }}
          uv-sync-args: ${{ inputs.uv-sync-args }}
          cache-key-suffix: code-quality

      - name: Load cached pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # The uv setup action already syncs with --locked, which fails on a stale
      # lockfile, so this step is the poetry track's equivalent of that check
      # rather than an extra gate the uv track is missing.
      - name: Check Poetry lock file consistency
        if: inputs.package-manager == 'poetry'
        run: poetry check --lock

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Poetry env
        if: inputs.package-manager == 'poetry'
        uses: django-mvp/shared/.github/actions/setup-poetry@v0.4.1
        with:
          python-version: ${{ inputs.python-version }}
          cache-key-suffix: security

      - name: Set up uv env
        if: inputs.package-manager == 'uv'
        uses: django-mvp/shared/.github/actions/setup-uv@v0.4.1
        with:
          python-version: ${{ inputs.python-version }}
          uv-sync-args: ${{ inputs.uv-sync-args }}
          cache-key-suffix: security

      - name: Run bandit security linter
        # This is a report, not a gate (ADR 0007): findings never fail the
        # build at v0.x, but a scanner that produces no report must — a broken
        # scanner silently looking like a clean scan is exactly how this job
        # went unnoticed (django-mvp/shared#23). The `|| true` swallows only
        # bandit's own "issues found" exit code; the emitted artefact is
        # asserted on next, never a piped exit code.
        run: |
          # The variable holds a command and its subcommand ("pip install" or
          # "uv pip install"), so the word split is intended here.
          # shellcheck disable=SC2086
          $PYTHON_INSTALL_CMD "bandit[toml]"
          bandit -r ${{ inputs.source-dir }}/ -f json -o bandit-report.json || true

      - name: Verify bandit report was produced
        run: |
          test -s bandit-report.json
          python3 -c "import json; json.load(open('bandit-report.json'))"

      - name: Upload bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Run pip-audit for known vulnerabilities
        # pip-audit replaces safety (django-mvp/shared#23): safety 3.x needs an
        # authenticated account against its vulnerability database, which is
        # the wrong shape for unattended CI. pip-audit needs none. It is
        # installed into, and run from, the project environment this job set up,
        # so it audits the packages actually installed rather than the runner's
        # bare system interpreter; --local excludes anything outside that
        # environment from the report.
        run: |
          # The variable holds a command and its subcommand ("pip install" or
          # "uv pip install"), so the word split is intended here.
          # shellcheck disable=SC2086
          $PYTHON_INSTALL_CMD pip-audit
          pip-audit --local --format json --output pip-audit-report.json --progress-spinner off || true

      - name: Verify pip-audit report was produced
        run: |
          test -s pip-audit-report.json
          python3 -c "import json; json.load(open('pip-audit-report.json'))"

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  package:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [code-quality]
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Poetry env
        if: inputs.package-manager == 'poetry'
        uses: django-mvp/shared/.github/actions/setup-poetry@v0.4.1
        with:
          python-version: ${{ inputs.python-version }}
          cache-key-suffix: package

      - name: Set up uv env
        if: inputs.package-manager == 'uv'
        uses: django-mvp/shared/.github/actions/setup-uv@v0.4.1
        with:
          python-version: ${{ inputs.python-version }}
          uv-sync-args: ${{ inputs.uv-sync-args }}
          cache-key-suffix: package

      - name: Build package
        run: ${{ inputs.package-manager }} build

      # `poetry check` validates the pyproject against poetry's own schema. uv
      # has no equivalent command, so the uv track asserts the built artefacts
      # instead: twine reads the wheel and sdist metadata the way PyPI's upload
      # endpoint does, including whether the rendered long description parses.
      # That is a check on what actually ships rather than on the source that
      # produced it. `uvx` runs it without adding twine to any bundle.
      - name: Check package metadata
        run: |
          if [ "${{ inputs.package-manager }}" = "uv" ]; then
            uvx twine check dist/*
          else
            poetry check
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
