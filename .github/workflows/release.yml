name: Release

on:
  workflow_call:
    outputs:
      tag:
        description: 'The release tag found on the triggering commit, empty if none'
        value: ${{ jobs.check-tag.outputs.tag }}

jobs:
  check-tag:
    name: Check for release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Check for version tag on triggering commit
        id: get_tag
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1)
          if [ -z "$TAG" ]; then
            echo "No version tag on this commit — skipping release."
          else
            echo "Release tag detected: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: check-tag
    timeout-minutes: 10
    if: ${{ needs.check-tag.outputs.tag != '' }}
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-tag.outputs.tag }}
          name: Release ${{ needs.check-tag.outputs.tag }}
          body: ${{ steps.github_release.outputs.changelog }}
