name: Prepare Release

# Step 1 of the family release flow: opens the release PR (version bump +
# CHANGELOG section). Merging that PR is the release decision; the Tag Release
# workflow then cuts the tag and GitHub Release from the merge commit.
#
# The token is not optional. Two things depend on it:
#   - The re-pin step rewrites files under .github/workflows, and GitHub refuses
#     those pushes from GITHUB_TOKEN whatever its `permissions:` block says —
#     `workflows` is not a scope that block can grant.
#   - A PR opened with GITHUB_TOKEN triggers no pull_request workflows, so
#     required checks never report on the release PR.
#
# Dispatched here, RELEASE_TOKEN comes from the org secret of that name. Called
# from another repository it cannot, because a reusable workflow sees only what
# its caller maps in, so callers pass it explicitly:
#
#     secrets:
#       RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
#
# `release-token` is the former name for the same thing and is still accepted.
# It is deprecated and will be removed once every caller has moved across.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level (patch | minor | major) or an explicit version like 1.2.3'
        type: string
        required: true
        default: 'patch'
  workflow_call:
    inputs:
      bump:
        description: 'Version bump level (patch | minor | major) or an explicit version'
        type: string
        required: true
    secrets:
      RELEASE_TOKEN:
        description: 'Token used to push the release branch and open the PR. Callers must pass it; dispatched here it resolves from the org secret of the same name.'
        required: false
      release-token:
        description: 'Deprecated former name for RELEASE_TOKEN. Still honoured so callers can repin without renaming in the same change. Will be removed.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the release token
        # Without this the run reaches the push 90 seconds later and fails on a
        # permission error that reads like a misconfigured token rather than an
        # absent one. Never let a missing credential fall through in silence.
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          LEGACY_TOKEN: ${{ secrets.release-token }}
        run: |
          if [ -n "${RELEASE_TOKEN:-}" ]; then
            exit 0
          fi
          if [ -n "${LEGACY_TOKEN:-}" ]; then
            echo "::warning::The release-token secret is deprecated. Pass it as"
            echo "::warning::RELEASE_TOKEN instead; release-token will be removed."
            exit 0
          fi
          echo "::error::No release token resolved. This workflow rewrites files"
          echo "::error::under .github/workflows, which GITHUB_TOKEN may never push."
          echo "::error::Set the RELEASE_TOKEN org secret, or pass it as RELEASE_TOKEN"
          echo "::error::when calling this workflow from another repository."
          exit 1

      - name: Check out
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.release-token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pipx install poetry

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          poetry version "$BUMP"
          VERSION="$(poetry version -s)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Guard against existing release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists — nothing to prepare."
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/heads/release/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Branch release/v$VERSION already exists — close or merge the open release PR first."
            exit 1
          fi

      - name: Re-pin the internal setup-poetry references to this release
        # These files call setup-poetry by owner/repo/path@ref rather than a
        # local path, because `uses: ./...` inside a reusable workflow resolves
        # against the CALLING repo's checkout, not this one. The references must
        # track this repo's own release tag or a downstream caller pinned to a
        # tag still transitively floats on @main (django-mvp/shared#24). The tag
        # this bump produces does not exist yet, but it will point at this exact
        # commit once Tag Release runs — the self-reference is only ever read by
        # a caller that has already resolved this tag, by which time it exists.
        #
        # Find the files rather than listing them. The hand-written list missed
        # docs.yml and publish-pypi/action.yml, which floated on @main across
        # three releases while the two named files were pinned correctly.
        #
        # This file is excluded because it quotes the reference as a search
        # pattern. Without that, the step rewrites its own patterns and the
        # check below reports its own source as unpinned.
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          PATTERN='django-mvp/shared/\.github/actions/setup-poetry'
          mapfile -t FILES < <(grep -rlE "${PATTERN}@" .github/ --exclude=prepare-release.yml)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No setup-poetry references found. The reference format"
            echo "::error::changed and this step is no longer re-pinning anything."
            exit 1
          fi
          printf 'Re-pinning %s file(s):\n' "${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"
          sed -i -E "s#(${PATTERN})@[^[:space:]]+#\1@v${VERSION}#" "${FILES[@]}"

      - name: Verify no setup-poetry reference was left behind
        # A missed file is invisible from downstream: the caller looks correctly
        # pinned. Fail the release rather than ship a half-pinned tag.
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          PATTERN='django-mvp/shared/\.github/actions/setup-poetry'
          STRAY="$(grep -rnE "${PATTERN}@" .github/ --exclude=prepare-release.yml \
                   | grep -vE "@v${VERSION}\$" || true)"
          if [ -n "$STRAY" ]; then
            echo "::error::setup-poetry references not pinned to v${VERSION}:"
            echo "$STRAY"
            exit 1
          fi
          echo "All setup-poetry references pinned to v${VERSION}."
          git diff --stat

      - name: Update changelog
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ] && grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            DATE="$(date +%Y-%m-%d)"
            sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [v${VERSION}] - ${DATE}/" CHANGELOG.md
            echo "CHANGELOG.md: opened section for v$VERSION"
          else
            echo "No CHANGELOG.md with an Unreleased section — skipping changelog update."
          fi

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.release-token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$VERSION"
          git add pyproject.toml .github
          [ -f CHANGELOG.md ] && git add CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git push -u origin "release/v$VERSION"
          gh pr create \
            --title "chore: release v$VERSION" \
            --body "Release PR for v$VERSION. Merging this PR is the release decision: the Tag Release workflow will create the \`v$VERSION\` tag and GitHub Release from the merge commit." \
            --base "${GITHUB_REF_NAME:-main}"
