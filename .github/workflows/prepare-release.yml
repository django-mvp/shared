name: Prepare Release

# Step 1 of the shared release flow: opens the release PR (version bump +
# CHANGELOG section). Merging that PR is the release decision; the Tag Release
# workflow then cuts the tag and GitHub Release from the merge commit.
#
# The token is not optional: a PR opened with GITHUB_TOKEN triggers no
# pull_request workflows, so required checks never report on the release PR.
#
# Dispatched here, RELEASE_TOKEN comes from the org secret of that name. Called
# from another repository it cannot, because a reusable workflow sees only what
# its caller maps in, so callers pass it explicitly:
#
#     secrets:
#       RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
#
# `release-token` is the former name for the same thing and is still accepted.
# It is deprecated and will be removed once every caller has moved across.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level (patch | minor | major) or an explicit version like 1.2.3'
        type: string
        required: true
        default: 'patch'
  workflow_call:
    inputs:
      bump:
        description: 'Version bump level (patch | minor | major) or an explicit version'
        type: string
        required: true
    secrets:
      RELEASE_TOKEN:
        description: 'Token used to push the release branch and open the PR. Callers must pass it; dispatched here it resolves from the org secret of the same name.'
        required: false
      release-token:
        description: 'Deprecated former name for RELEASE_TOKEN. Still honoured so callers can repin without renaming in the same change. Will be removed.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the release token
        # Without this the run reaches the push 90 seconds later and fails on a
        # permission error that reads like a misconfigured token rather than an
        # absent one. Never let a missing credential fall through in silence.
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          LEGACY_TOKEN: ${{ secrets.release-token }}
        run: |
          if [ -n "${RELEASE_TOKEN:-}" ]; then
            exit 0
          fi
          if [ -n "${LEGACY_TOKEN:-}" ]; then
            echo "::warning::The release-token secret is deprecated. Pass it as"
            echo "::warning::RELEASE_TOKEN instead; release-token will be removed."
            exit 0
          fi
          echo "::error::No release token resolved. A release PR opened with"
          echo "::error::GITHUB_TOKEN runs no checks, so it could never merge."
          echo "::error::Set the RELEASE_TOKEN org secret, or pass it as RELEASE_TOKEN"
          echo "::error::when calling this workflow from another repository."
          exit 1

      - name: Check out
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.release-token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      # `uv version` updates the project's own entry in uv.lock along with
      # pyproject.toml. Editing pyproject.toml alone leaves the lockfile out of
      # date, and every `uv sync --locked` on the release commit then fails.
      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in
            major|minor|patch) uv version --bump "$BUMP" --no-sync ;;
            *) uv version "$BUMP" --no-sync ;;
          esac
          VERSION="$(uv version --short)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Guard against existing release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists — nothing to prepare."
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/heads/release/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Branch release/v$VERSION already exists — close or merge the open release PR first."
            exit 1
          fi

      - name: Update changelog
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ] && grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            DATE="$(date +%Y-%m-%d)"
            sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [v${VERSION}] - ${DATE}/" CHANGELOG.md
            echo "CHANGELOG.md: opened section for v$VERSION"
          else
            echo "No CHANGELOG.md with an Unreleased section — skipping changelog update."
          fi

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.release-token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$VERSION"
          git add pyproject.toml uv.lock
          [ -f CHANGELOG.md ] && git add CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git push -u origin "release/v$VERSION"
          gh pr create \
            --title "chore: release v$VERSION" \
            --body "Release PR for v$VERSION. Merging this PR is the release decision: the Tag Release workflow will create the \`v$VERSION\` tag and GitHub Release from the merge commit." \
            --base "${GITHUB_REF_NAME:-main}"
