name: Tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: 'Codecov upload token. Optional: without it the upload is attempted anonymously, which Codecov only accepts for public repositories whose owner has turned off the token requirement.'
        required: false
    inputs:
      python-versions:
        description: 'JSON array of Python versions to test against, e.g. ["3.11","3.12"]'
        type: string
        default: '["3.12", "3.13"]'
      django-versions:
        description: 'JSON array of Django versions to test against, e.g. ["4.2","5.2"]'
        type: string
        default: '["5.2", "6.0"]'
      uv-sync-args:
        description: 'Extra args passed to uv sync, e.g. --extra test'
        type: string
        default: ''
      coverage-package:
        description: 'Package directory to measure coverage for, e.g. mvp or dac'
        type: string
        required: true
      coverage-python-version:
        description: 'Python version to use for the coverage run, e.g. "3.13"'
        type: string
        default: '3.13'
      coverage-django-version:
        description: 'Django version to use for the coverage run, e.g. "5.2"'
        type: string
        default: '5.2'
      install-playwright:
        description: 'Whether to install Playwright browsers before running tests'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }}
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
        django-version: ${{ fromJson(inputs.django-versions) }}
      fail-fast: false
    env:
      # `uv run` normally re-syncs the environment to uv.lock before every
      # command. Here that would quietly undo the Django version installed for
      # this matrix leg and run every leg against the locked Django instead. The
      # environment is synced once, explicitly, in the step below.
      UV_NO_SYNC: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.django-version }}

      # --locked fails the job when uv.lock is out of date with pyproject.toml,
      # rather than re-resolving and testing whatever that happens to produce.
      - name: Sync dependencies
        run: uv sync --locked ${{ inputs.uv-sync-args }}

      - name: Pin Django version
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}
        run: |
          uv pip install "django~=${DJANGO_VERSION}.0"
          # Fail rather than report a matrix leg that never ran on its Django.
          uv run python -c "import django, os, sys; want = os.environ['DJANGO_VERSION']; got = '.'.join(map(str, django.VERSION[:2])); print(f'Django {django.__version__}'); sys.exit(0 if got == want else f'expected Django {want}, got {got}')"

      - name: Resolve Playwright version
        if: inputs.install-playwright
        id: playwright-version
        run: echo "version=$(uv run python -c 'import importlib.metadata; print(importlib.metadata.version(\"playwright\"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: inputs.install-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: inputs.install-playwright
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        env:
          IS_COVERAGE_RUN: ${{ matrix.python-version == inputs.coverage-python-version && matrix.django-version == inputs.coverage-django-version }}
        run: |
          if [ "$IS_COVERAGE_RUN" = "true" ]; then
            uv run pytest --cov=${{ inputs.coverage-package }} --cov-report=xml
          else
            uv run pytest
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == inputs.coverage-python-version && matrix.django-version == inputs.coverage-django-version
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}
