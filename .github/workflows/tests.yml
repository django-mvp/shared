name: Tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: 'Codecov upload token. Optional: without it the upload is attempted anonymously, which Codecov only accepts for public repositories whose owner has turned off the token requirement.'
        required: false
    inputs:
      python-versions:
        description: 'JSON array of Python versions to test against, e.g. ["3.11","3.12"]'
        type: string
        default: '["3.12", "3.13"]'
      django-versions:
        description: 'JSON array of Django versions to test against, e.g. ["4.2","5.2"]'
        type: string
        default: '["5.2", "6.0"]'
      package-manager:
        description: 'Which package manager sets up the environment: poetry or uv'
        type: string
        default: 'poetry'
      poetry-install-args:
        description: 'Extra args passed to poetry install, e.g. --with test. Ignored when package-manager is uv'
        type: string
        default: '--with test'
      uv-sync-args:
        description: 'Extra args passed to uv sync, e.g. --extra test. Ignored when package-manager is poetry'
        type: string
        default: ''
      coverage-package:
        description: 'Package directory to measure coverage for, e.g. mvp or dac'
        type: string
        required: true
      coverage-python-version:
        description: 'Python version to use for the coverage run, e.g. "3.13"'
        type: string
        default: '3.13'
      coverage-django-version:
        description: 'Django version to use for the coverage run, e.g. "5.2"'
        type: string
        default: '5.2'
      install-playwright:
        description: 'Whether to install Playwright browsers before running tests'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }}
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
        django-version: ${{ fromJson(inputs.django-versions) }}
      fail-fast: false

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Poetry env
        if: inputs.package-manager == 'poetry'
        uses: django-mvp/shared/.github/actions/setup-poetry@v0.4.1
        with:
          python-version: ${{ matrix.python-version }}
          poetry-install-args: ${{ inputs.poetry-install-args }}
          cache-key-suffix: ${{ matrix.django-version }}

      - name: Set up uv env
        if: inputs.package-manager == 'uv'
        uses: django-mvp/shared/.github/actions/setup-uv@v0.4.1
        with:
          python-version: ${{ matrix.python-version }}
          uv-sync-args: ${{ inputs.uv-sync-args }}
          cache-key-suffix: ${{ matrix.django-version }}

      # Both setup actions put the environment's bin directory on PATH and export
      # PYTHON_INSTALL_CMD, so every step below is written once and runs unchanged
      # on either track.
      - name: Pin Django version
        run: |
          # The variable holds a command and its subcommand ("pip install" or
          # "uv pip install"), so the word split is intended here.
          # shellcheck disable=SC2086
          $PYTHON_INSTALL_CMD "django~=${{ matrix.django-version }}"

      - name: Resolve Playwright version
        if: inputs.install-playwright
        id: playwright-version
        run: echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version(\"playwright\"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: inputs.install-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: inputs.install-playwright
        run: playwright install --with-deps chromium

      - name: Run tests
        env:
          IS_COVERAGE_RUN: ${{ matrix.python-version == inputs.coverage-python-version && matrix.django-version == inputs.coverage-django-version }}
        run: |
          if [ "$IS_COVERAGE_RUN" = "true" ]; then
            pytest --cov=${{ inputs.coverage-package }} --cov-report=xml
          else
            pytest
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == inputs.coverage-python-version && matrix.django-version == inputs.coverage-django-version
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}
