name: "Setup Poetry Environment"
description: "Set up Python and Poetry with dependency caching"

inputs:
  python-version:
    description: "Python version to use"
    default: "3.13"
    required: false
  poetry-version:
    description: "Poetry version to install"
    default: "2.3.2"
    required: false
  poetry-install-args:
    description: "Additional arguments for poetry install (e.g. --with dev --with test)"
    default: ""
    required: false
  cache-key-suffix:
    description: >-
      Extra string to disambiguate the venv cache key from any other job or matrix
      leg in the same workflow run that resolves to the same
      (python-version, poetry-version, poetry-install-args) tuple — e.g. the job id
      or a matrix value. Concurrent call sites that omit this and share that tuple
      race to save the same cache entry (django-mvp/shared#22); required whenever
      more than one such call site exists in the same workflow.
    default: ""
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ inputs.poetry-version }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    # The key carries the *resolved* interpreter (3.13.15), not the requested
    # series (3.13). A Poetry in-project venv records an absolute interpreter
    # path in .venv/pyvenv.cfg, so a venv saved on one patch release is dead on
    # a runner image carrying the next one. Keying on the series meant the
    # hosted tool cache rolling a patch silently poisoned every entry
    # (ADR 0008).
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ inputs.poetry-version }}-${{ inputs.poetry-install-args }}-${{ inputs.cache-key-suffix }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ inputs.poetry-version }}-${{ inputs.poetry-install-args }}-${{ inputs.cache-key-suffix }}-
          venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ inputs.poetry-version }}-${{ inputs.poetry-install-args }}-
          venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ inputs.poetry-version }}-

    # Unconditional, and it has to stay that way. Poetry discards a venv it
    # considers broken and builds an empty one in its place, which is what a
    # restore across a dead interpreter path produces. That happens during the
    # step below, after any cache-hit condition here has already been decided,
    # so gating this step on a cache miss leaves nothing to refill the venv and
    # the job dies at the first `poetry run`. Against a healthy restored venv
    # this resolves to no operations.
    - name: Install dependencies
      shell: bash
      run: poetry install --no-interaction --no-root ${{ inputs.poetry-install-args }}

    - name: Install project
      shell: bash
      run: poetry install --no-interaction --only-root
