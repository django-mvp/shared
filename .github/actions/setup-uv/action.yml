name: "Setup uv Environment"
description: "Set up Python and uv with dependency caching"

inputs:
  python-version:
    description: "Python version to use"
    default: "3.13"
    required: false
  uv-version:
    description: "uv version to install"
    default: "0.11.19"
    required: false
  uv-sync-args:
    description: "Additional arguments for uv sync (e.g. --extra dev --extra test)"
    default: ""
    required: false
  cache-key-suffix:
    description: >-
      Extra string to disambiguate the cache key from any other job or matrix leg
      in the same workflow run that resolves to the same
      (python-version, uv-version, uv-sync-args) tuple — e.g. the job id or a
      matrix value. Concurrent call sites that omit this and share that tuple race
      to save the same cache entry; required whenever more than one such call site
      exists in the same workflow.
    default: ""
    required: false

runs:
  using: "composite"
  steps:
    # uv installs and manages the interpreter itself, so there is no separate
    # actions/setup-python step on this track. The interpreter comes from
    # python-build-standalone rather than the runner's hosted tool cache.
    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"
        cache-suffix: ${{ inputs.cache-key-suffix }}

    # What is cached here is uv's global package cache, not the resolved venv.
    # The poetry track caches .venv directly and has to key on the *resolved*
    # interpreter patch release, because an in-project venv records an absolute
    # interpreter path and dies when the runner image rolls (ADR 0008). Caching
    # the download cache instead sidesteps that class of failure entirely: the
    # venv is always built fresh, from cached wheels.
    - name: Sync dependencies
      shell: bash
      # --locked fails the job when uv.lock is out of date with pyproject.toml
      # rather than silently re-resolving. This matches `poetry install`, which
      # refuses an inconsistent lock; plain `uv sync` would rewrite the lockfile
      # in place and test whatever it happened to resolve to.
      run: uv sync --locked ${{ inputs.uv-sync-args }}

    # Put the venv on PATH so every downstream step invokes tools bare — `pytest`,
    # `sphinx-build`, `pre-commit` — and the calling workflow needs only one copy
    # of each step regardless of which package manager set the environment up.
    - name: Export the environment
      shell: bash
      run: |
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "PYTHON_INSTALL_CMD=uv pip install" >> "$GITHUB_ENV"
